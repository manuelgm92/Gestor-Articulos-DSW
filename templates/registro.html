
{% extends "base.html" %}

{% block contenido %}

<h2>Registro de usuario</h2>

{% with messages=get_flashed_messages() %}
    {% if messages %}
        {% for m in messages %}
            <li>{{m}}</li>
        {% endfor %}
    {% endif %}
{% endwith %}
<form method="POST"
      action="{{ url_for('registro') }}">

    <label for="usuario">
        Nombre de usuario:
    </label>

    <input type="text"
           id="usuario"
           name="usuario">

    <br><br>

    <label for="password">
        Contraseña:
    </label>

    <input type="password"
           id="password"
           name="password">

    <br><br>

    <label for="confirma_password">
        Confirmación de contraseña:
    </label>

    <input type="password"
           id="confirma_password"
           name="confirma_password">

    <br><br>


    <button type="submit">
        Registrarse
    </button>

</form>

<p>
    <a href="{{ url_for('login') }}">
        Volver al inicio de sesión
    </a>
</p>

{% endblock %}
